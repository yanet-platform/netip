name: Proofs

on:
  push:
    branches: [main]
    paths:
      - "proofs/**"
      - "!proofs/drift/**"
      - "!proofs/pins.txt"
      - ".github/workflows/proofs.yml"
  pull_request:
    branches: [main]
    paths:
      - "proofs/**"
      - "!proofs/drift/**"
      - "!proofs/pins.txt"
      - ".github/workflows/proofs.yml"

jobs:
  lean:
    name: Lean
    runs-on: ubuntu-latest
    # The build takes about three minutes. A stalled job fails instead of
    # holding the PR until GitHub's six-hour limit.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: proofs
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # `lake` fetches the toolchain on first use, and that fetch has stalled
      # without a line of output on some runs, while it normally takes seconds.
      # Fetching it up front bounds each attempt and retries.
      - name: Install the toolchain
        run: |
          for attempt in 1 2 3; do
            if timeout 120 elan toolchain install "$(cat lean-toolchain)"; then
              exit 0
            fi
            echo "::warning::toolchain download attempt $attempt failed or stalled"
          done
          exit 1

      # A proof that is not checked must not pass: `sorry` is reported as a
      # warning, which `--wfail` below turns into a failure, and these escape
      # hatches are rejected outright.
      - name: Reject unchecked proofs
        run: |
          if grep -rnwE "sorry|admit|native_decide|skipKernelTC" --include='*.lean' Netip Netip.lean \
            || grep -rnE "^\s*((private|protected|noncomputable)\s+)*(axiom|unsafe)\b" --include='*.lean' Netip Netip.lean; then
            exit 1
          fi

      - name: Build
        run: lake build --wfail
